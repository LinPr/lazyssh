name: Release

# Builds release binaries when a version tag is pushed:
#
#   git tag v2.0.0
#   git push origin v2.0.0
#
# Targets: linux/amd64 and windows/amd64.
# Publishes lazyssh-linux-amd64, lazyssh-windows-amd64.exe and checksums.txt
# as a GitHub Release.

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job is allowed to write.
permissions:
  contents: read

# Two tags pushed in quick succession must not race on the same release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Pure-Go static binaries: no libc dependency, runs on any distro.
  CGO_ENABLED: "0"
  # Strip local build paths so the binaries are reproducible.
  GOFLAGS: "-trimpath"

jobs:
  # Fail fast: never publish a tag that does not build or pass its tests.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Cheap insurance against a windows-only compile break: the matrix below
      # would catch it, but only after the test job has already passed.
      - name: Cross-compile check
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Build the other target even if one fails, so both logs are available.
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the commit hash is always resolvable.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          out="lazyssh-${GOOS}-${GOARCH}${EXT}"

          go build \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit}" \
            -o "${out}" ./cmd/

          echo "built ${out}: $(stat -c%s "${out}") bytes, version=${version}, commit=${commit}"
          file "${out}"

      - name: Smoke test
        # Only the Linux binary can run on this runner; the Windows one is
        # validated by the build plus the cross-compile check in the test job.
        if: matrix.goos == 'linux'
        run: |
          chmod +x lazyssh-linux-amd64
          ./lazyssh-linux-amd64 --version
          ./lazyssh-linux-amd64 --help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazyssh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lazyssh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
          # Binaries barely compress; skipping zlib makes the upload much faster.
          compression-level: 0

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          # Artifacts are zipped on upload, which drops the executable bit.
          chmod +x lazyssh-linux-amd64 lazyssh-windows-amd64.exe
          ls -l
          sha256sum lazyssh-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          # Tags like v2.1.0-rc1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/lazyssh-linux-amd64
            dist/lazyssh-windows-amd64.exe
            dist/checksums.txt
